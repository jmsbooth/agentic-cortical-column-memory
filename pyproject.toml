[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccm-reference"
version = "0.1.0"
description = "Dependency-free reference implementation and validation harness for Cortical-Column Memory"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "James Booth" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["ccm*", "experiments*", "evaluation*"]
